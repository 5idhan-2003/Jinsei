name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_FILE" app/build/outputs/apk/debug/Jinsei.apk
          echo "Generated Jinsei.apk from $APK_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: Jinsei-apk
          path: android/app/build/outputs/apk/debug/Jinsei.apk

